<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>부천활박물관 PBL x 컴퓨터 그래픽스 TEAM2</title><link rel="stylesheet" href="style.css?v=lighting-20261112i"></head>
<body><main class="app"><section class="stage"><div class="viewport"><canvas id="cv" tabindex="0" aria-label="박물관 구조 모델. PC: WASD 이동, 방향키 회전, 휠 확대 축소"></canvas><div id="labels"></div><div id="error" role="alert" hidden></div><div id="asset-markers" aria-label="평면도에 배치된 2D 에셋"></div><div id="asset-locations" aria-label="평면도 에셋 번호 위치"></div><div id="light-markers" aria-label="평면도 조명 위치" hidden></div></div></section>
<button type="button" class="mobile-panel-toggle" aria-controls="options-panel" aria-expanded="false">설정 열기</button>
<aside id="options-panel" aria-label="관람 설정"><nav class="mode-nav" aria-label="관람 방식"><button type="button" data-navigation="plan" aria-pressed="false">평면도</button><button type="button" data-navigation="orbit" class="active" aria-pressed="true">둘러보기</button><button type="button" data-navigation="interior" aria-pressed="false">1인칭</button></nav>
<div class="panel-scroll">
<details class="course-panel">
<summary>1인칭 관람 코스</summary>
<form id="course-form">
<label for="course-stop">방문 지점</label><select id="course-stop"></select>
<label for="course-seconds">체류 시간(초)</label><input id="course-seconds" type="number" min="0" max="3600" step="1" value="5" required>
<button type="submit">코스에 추가</button>
</form>
<ol id="course-list"></ol>
<button id="course-play" type="button" disabled>1인칭 재생</button>
<button id="course-stop-playback" type="button" disabled>중지</button>
<p id="course-status" role="status"></p>
</details>
<details class="lighting-panel-wrap">
<summary>조명과 햇빛</summary>
<div id="lighting-panel"></div>
</details>
<section class="asset-upload" aria-labelledby="asset-upload-title"><h2 id="asset-upload-title">에셋 업로드</h2><div id="asset-groups"></div></section></div></aside></main>
