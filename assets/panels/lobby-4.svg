ongjo','Batang','바탕',serif" font-size="37.1" font-weight="400" fill="#2a2420" text-anchor="middle">무관을 뽑는 시험의</text><text x="1552.7" y="632.6" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="37.1" font-weight="400" fill="#2a2420" text-anchor="middle">핵심 과목이 활쏘기였다</text><circle cx="2540.3" cy="415.5" r="22.3" fill="#9b2b1f"/><text x="2540.3" y="356.2" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="44.5" font-weight="400" fill="#6d6257" text-anchor="middle">조선 후기</text><text x="2540.3" y="504.6" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="55.6" font-weight="700" fill="#2a2420" text-anchor="middle">활터와 사정(射亭)</text><text x="2540.3" y="578.8" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="37.1" font-weight="400" fill="#2a2420" text-anchor="middle">마을마다 활터를 두고</text><text x="2540.3" y="632.6" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="37.1" font-weight="400" fill="#2a2420" text-anchor="middle">함께 활을 쏘며 예를 익혔다</text><circle cx="3528.0" cy="415.5" r="22.3" fill="#9b2b1f"/><text x="3528.0" y="356.2" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="44.5" font-weight="400" fill="#6d6257" text-anchor="middle">오늘</text><text x="3528.0" y="504.6" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="55.6" font-weight="700" fill="#2a2420" text-anchor="middle">이어지는 국궁</text><text x="3528.0" y="578.8" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="37.1" font-weight="400" fill="#2a2420" text-anchor="middle">전국의 활터에서</text><text x="3528.0" y="632.6" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="37.1" font-weight="400" fill="#2a2420" text-anchor="middle">145m 거리의 과녁을 겨눈다</text><text x="4033.6" y="700.4" font-family="'Noto Serif KR','Nanum Myeongjo','Batang','바탕',serif" font-size="20.8" font-weight="400" fill="#6d